<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple butterfly silhouette - top view with wings spread -->
  <!-- body -->
  <ellipse cx="40" cy="40" rx="4" ry="20"/>
  <!-- head -->
  <circle cx="40" cy="18" r="5"/>
  <!-- antennae -->
  <path d="M38 14 Q32 6 28 4" fill="none" stroke="black" stroke-width="2"/>
  <path d="M42 14 Q48 6 52 4" fill="none" stroke="black" stroke-width="2"/>
  <!-- forewings -->
  <ellipse cx="22" cy="32" rx="18" ry="14" transform="rotate(-15 22 32)"/>
  <ellipse cx="58" cy="32" rx="18" ry="14" transform="rotate(15 58 32)"/>
  <!-- hindwings -->
  <ellipse cx="20" cy="52" rx="14" ry="12" transform="rotate(-20 20 52)"/>
  <ellipse cx="60" cy="52" rx="14" ry="12" transform="rotate(20 60 52)"/>
</svg>
